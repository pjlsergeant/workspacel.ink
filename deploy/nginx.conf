# The README's hosting requirements: dist/index.html for every path, 200, no
# redirects, nothing recorded, and the security headers the page can't set.
server {
    listen 80 default_server;
    server_name _;

    access_log off;
    # Request-level errors log the client address; only record real failures.
    error_log /dev/stderr crit;
    log_not_found off;
    server_tokens off;

    root /usr/share/nginx/html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files /index.html =404;
    }
}
