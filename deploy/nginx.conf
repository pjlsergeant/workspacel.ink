# The README's hosting requirements: dist/index.html for every path, 200, no
# redirects, nothing recorded, and the security headers the page can't set.
# A complete nginx.conf, so no inherited log directive survives: even crit
# errors can carry the request line. Startup failures still reach stderr.
worker_processes auto;
error_log /dev/null;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    log_not_found off;
    server_tokens off;
    sendfile on;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;

        location / {
            try_files /index.html =404;
        }
    }
}
